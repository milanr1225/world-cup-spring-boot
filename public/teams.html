<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teams</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/global.css">
    <style>
        #games {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            justify-content: center;
        }

        .game-card {
            width: 18rem;
        }
    </style>
</head>

<body class="d-flex flex-column min-vh-100">
    <div class="container">
        <div class="card">
            <div class="card-header fw-bold">
                <h1>Teams</h1>
            </div>
            <div class="card-body">
                <table class="table">
                    <thead>
                        <tr>
                            <th scope="col">
                                <h2>#</h2>
                            </th>
                            <th scope="col">
                                <h2>Team Name</h2>
                            </th>
                            <th scope="col">
                                <h2>Details</h2>
                            </th>
                        </tr>
                    </thead>
                    <tbody id="teams"></tbody>
                </table>
            </div>
            <div class="card-footer">
                <a href="/new-team.html" class="btn btn-primary">Add Team</a>
            </div>
        </div>
    </div>
    <footer class="text-center border-top boja-footer mt-auto">
        <br>
        All of the rights to the real info is held by FIFA, this is a learning project.&copy;
        <i class="fa-brands fa-instagram fa-2x"></i>
        <i class="fa-brands fa-x-twitter fa-2x"></i>
        <i class="fa-brands fa-facebook-f fa-2x"></i>
        <br><br>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="/js/utils.js"></script>

    <script>
        function edit(id) {
            window.location.href = '/edit-team.html?id=' + id
        }

        function remove(id) {
            showConfirm(`Delete Team: ${id}?`, () => {
                fetch(`api/teams/${id}`, { method: 'delete' })
                    .then(data => window.location.reload())
            })
        }

        retrieveData('/api/teams', (data) => {
            const list = document.getElementById('teams')
            let content = ''
            for (let team of data) {
                content += `
                            <tr>
                                <th scope="row">${team.teamId}</th>
                                    <td>${team.name}</td>
                                    <td>
                                        <div class="btn-group">
                                        <button class="btn btn-sm btn-success" type="button" onclick="edit(${team.teamId})">
                                            <i class="fa-solid fa-pen-to-square"></i>
                                        </button> 
                                        <button class="btn btn-sm btn-danger" type="button" onclick="remove(${team.teamId})">
                                            <i class="fa-solid fa-trash-can"></i>
                                        </button> 
                                        </div>
                                    </td>
                            </tr>
          `
            }
            list.innerHTML = content
        })
    </script>
</body>

</html>
